# Ownswitch — OpenSIPS digest auth failures (REGISTER / INVITE)
# Matches journald / syslog lines from opensips.cfg:
#   REGISTER auth failed for user@domain src=1.2.3.4
#   INVITE auth failed for user src=1.2.3.4
[Definition]
failregex = ^\s*(?:\S+\s+)*(?:opensips(?:\[\d+\])?:?\s+)?(?:WARNING|WARN|ERR|ERROR|NOTICE|INFO)?:?\s*.*\b(?:REGISTER|INVITE)\s+auth failed\b.*\bsrc=<HOST>\b
            ^\s*.*\b(?:REGISTER|INVITE)\s+auth failed\b.*\bsrc=<HOST>\b
ignoreregex =
datepattern = {^LN-BEG}
